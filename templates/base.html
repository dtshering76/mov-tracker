<!DOCTYPE html>
<html>
<head>
    <title>MOV Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 15px; }
        h1, h2, h3 { color: #2c3e50; }
        .standard-block { margin-bottom: 25px; border: 1px solid #ddd; border-radius: 6px; padding: 15px; }
        .focus-area { margin-left: 15px; margin-bottom: 15px; }
        .mov-item { margin-left: 15px; padding: 6px 0; }
        .status-done { color: green; font-weight: bold; }
        .status-pending { color: #b8860b; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        a.button { display: inline-block; padding: 6px 12px; background: #2c3e50; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
        nav { margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav>
    {% if user.is_authenticated %}
        Logged in as <strong>{{ user.username }}</strong> |
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background:none; border:none; color:blue; text-decoration:underline; cursor:pointer; padding:0; font:inherit;">Logout</button>
        </form>
    {% endif %}
</nav>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
